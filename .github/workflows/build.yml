
name: SONGDNA Studio 1.9 - Clean Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract, Validate and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="SONGDNA_Studio_1_9_CleanBuild_Developer.zip"
          ZIP_FILE="$GITHUB_WORKSPACE/$ZIP_NAME"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found: $ZIP_NAME"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          SOURCE_DIR="$RUNNER_TEMP/songdna-source"
          mkdir -p "$SOURCE_DIR"

          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          SETTINGS_FILE="$(find "$SOURCE_DIR" -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -path '*/android-wrapper/*' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android project settings file not found."
            find "$SOURCE_DIR" -maxdepth 6 -type f -print
            exit 1
          fi

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"
          PROJECT_DIR="$(dirname "$ANDROID_DIR")"

          echo "Android project: $ANDROID_DIR"
          echo "Source root: $PROJECT_DIR"

          rsync -a --exclude='.github/' "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"

          test -f android-wrapper/app/build.gradle.kts

          echo "Source extraction successful."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f android-wrapper/settings.gradle.kts || \
          test -f android-wrapper/settings.gradle

          test -f android-wrapper/app/build.gradle.kts

          echo "Android project structure verified."

      - name: Build Android debug APK
        run: |
          gradle --no-daemon --stacktrace --warning-mode all \
            -p android-wrapper clean assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            find android-wrapper -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-1.9-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
