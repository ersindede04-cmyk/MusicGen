
name: SONGDNA Studio 1.9 - Clean Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract, Validate and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="SONGDNA_Studio_1_9_CleanBuild_Developer.zip"
          ZIP_FILE="$GITHUB_WORKSPACE/$ZIP_NAME"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found: $ZIP_NAME"
            echo "Files in repository:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          SOURCE_DIR="$RUNNER_TEMP/songdna-source"
          mkdir -p "$SOURCE_DIR"

          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          SETTINGS_FILE="$(find "$SOURCE_DIR" -type f \
            -path '*/android-wrapper/settings.gradle.kts' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android settings.gradle.kts not found."
            find "$SOURCE_DIR" -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$SETTINGS_FILE")")"

          echo "SONGDNA_SOURCE_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Source project found:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses < <(yes)

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source files
        working-directory: ${{ env.SONGDNA_SOURCE_DIR }}
        run: python3 scripts/verify-source.py

      - name: Build Android debug APK
        working-directory: ${{ env.SONGDNA_SOURCE_DIR }}
        run: |
          gradle --no-daemon --stacktrace \
            --warning-mode all \
            -p android-wrapper \
            clean assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          APK="$SONGDNA_SOURCE_DIR/android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            find "$SONGDNA_SOURCE_DIR/android-wrapper/app/build/outputs" \
              -type f -print 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-1.9-debug-APK
          path: ${{ env.SONGDNA_SOURCE_DIR }}/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
