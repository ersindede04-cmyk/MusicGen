
name: SONGDNA Studio 1.9 - Build APK from ZIP

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract source, validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract SONGDNA source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'SONGDNA_Studio_1_9_CleanBuild_Developer.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo '::error::SONGDNA source ZIP was not found.'
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/songdna-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/songdna-source"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/songdna-source" -type f -path '*/android-wrapper/settings.gradle.kts' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo '::error::Android project not found in ZIP.'
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$SETTINGS_FILE")")"
          rsync -a --exclude='.github/' "$PROJECT_DIR/" ./

          test -f android-wrapper/app/build.gradle.kts
          test -f scripts/verify-source.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source
        run: python3 scripts/verify-source.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all -p android-wrapper clean assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK='android-wrapper/app/build/outputs/apk/debug/app-debug.apk'
          if [ ! -s "$APK" ]; then
            echo "::error::APK was not created: $APK"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-1.9-debug-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
