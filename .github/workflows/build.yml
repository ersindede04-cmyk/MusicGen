
name: SONGDNA Studio 1.9 - Clean Android APK Build

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songdna-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract, Validate and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract SONGDNA source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="SONGDNA_Studio_1_9_GitHub_ZIP_to_APK_Kit.zip"
          ZIP_FILE="$GITHUB_WORKSPACE/$ZIP_NAME"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found: $ZIP_NAME"
            echo "Repository files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          SOURCE_DIR="$RUNNER_TEMP/songdna-source"
          mkdir -p "$SOURCE_DIR"

          echo "Extracting: $ZIP_NAME"
          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          echo "Checking Android project..."

          SETTINGS_FILE="$(find "$SOURCE_DIR" -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -path '*/android-wrapper/*' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android settings.gradle file not found in ZIP."
            find "$SOURCE_DIR" -maxdepth 5 -type f -print
            exit 1
          fi

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"
          PROJECT_DIR="$(dirname "$ANDROID_DIR")"

          echo "Android directory: $ANDROID_DIR"
          echo "Project directory: $PROJECT_DIR"

          rsync -a --exclude='.github/' "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"

          test -f android-wrapper/app/build.gradle.kts
          test -f scripts/verify-source.py

          echo "Source extraction and validation completed."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager --licenses

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source
        run: python3 scripts/verify-source.py

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all \
            -p android-wrapper clean assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONGDNA-Studio-1.9-Android-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
